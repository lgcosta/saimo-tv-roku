name: Release

# Compila o projecto BrighterScript e publica o pacote .zip do Roku como
# release do GitHub. Executa quando uma tag v* e criada.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Preparar o Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Compilar (bsc) e validar
        run: npx bsc

      - name: Montar o pacote
        run: |
          set -e
          test -f build/manifest
          mkdir -p dist
          cd build
          zip -r -X ../dist/saimo-tv-pkg.zip .
          unzip -l ../dist/saimo-tv-pkg.zip | tail -3

      - name: Publicar a release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/saimo-tv-pkg.zip
          name: Saimo TV ${{ github.ref_name }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
