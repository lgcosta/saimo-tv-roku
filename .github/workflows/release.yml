name: Release

# Publica o pacote .zip do Roku como release do GitHub.
# Executa quando uma tag v* e criada.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Montar o pacote
        run: |
          set -e
          mkdir -p dist
          zip -r -X dist/saimo-tv-pkg.zip . \
            -x 'dist/*' '.git/*' '.github/*' \
               'README.md' 'CHANGELOG.md' 'LICENSE' '.gitignore'
          unzip -l dist/saimo-tv-pkg.zip | tail -3

      - name: Publicar a release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/saimo-tv-pkg.zip
          name: Saimo TV ${{ github.ref_name }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
